<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Link</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="#">🔗 Link Admin</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    Admin: {{ user.prenom }} {{ user.nom }}
                </span>
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'tableau_de_bord' %}">
                    Retour utilisateur
                </a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'deconnexion' %}">
                    Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">Panel d'administration</h4>
                    </div>
                    <div class="card-body">
                        <h5>Bienvenue administrateur !</h5>
                        <p>Vous avez accès aux fonctionnalités administratives.</p>
                        
                        <div class="row mt-4">
                            <div class="col-md-4">
                                <div class="card text-white bg-primary">
                                    <div class="card-body">
                                        <h5 class="card-title">Utilisateurs</h5>
                                        <p class="card-text">Gérer les utilisateurs</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card text-white bg-success">
                                    <div class="card-body">
                                        <h5 class="card-title">Statistiques</h5>
                                        <p class="card-text">Voir les analytics</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card text-white bg-warning">
                                    <div class="card-body">
                                        <h5 class="card-title">Paramètres</h5>
                                        <p class="card-text">Configurer l'application</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
